<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3d6a1" stop-opacity="0.95"></stop>
      <stop offset="70%" stop-color="#cbb88a" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="transparent"></stop>
    </radialGradient>

    <radialGradient id="innerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5d9" stop-opacity="1"></stop>
      <stop offset="60%" stop-color="#d9c89a" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="transparent"></stop>
    </radialGradient>
  </defs>

  <!-- Outer halo -->
  <circle cx="256" cy="256" r="240" fill="url(#outerGlow)"></circle>

  <!-- Middle ring -->
  <circle cx="256" cy="256" r="200" stroke="#cbb88a" stroke-width="4" stroke-opacity="0.55" fill="none"></circle>

  <!-- Arcane rune ticks -->
  <g stroke="#cbb88a" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <!-- 24 rune tick marks -->
    <g transform="translate(256,256)">
      <!-- Auto-generated 24 ticks -->
      <!-- Each tick is rotated by 15 degrees -->
      <!-- Length small to keep elegant occult effect -->
      <!-- I’ll generate programmatically: -->
      <!-- Ticks -->
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(0)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(15)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(30)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(45)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(60)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(75)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(90)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(105)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(120)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(135)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(150)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(165)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(180)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(195)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(210)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(225)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(240)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(255)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(270)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(285)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(300)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(315)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(330)"></line>
      <line x1="0" y1="-200" x2="0" y2="-175" transform="rotate(345)"></line>
    </g>
  </g>

  <!-- Inner glowing core -->
  <circle cx="256" cy="256" r="120" fill="url(#innerCore)"></circle>
</svg>
